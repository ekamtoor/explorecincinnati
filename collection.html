<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>explore.cincinnati — Collection</title>
<meta name="description" content="Photographs, fine-art prints and the stories behind them — Cincinnati, seen slowly. Test site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F2EE}
a{color:#141518;text-decoration:none}a:hover{color:#0E5A6C}
.glass{background:rgba(255,255,255,0.58);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 12px 40px rgba(20,21,24,0.08)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes swapIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}
.live{animation:blink 2.4s ease-in-out infinite}
.swap{animation:swapIn .7s cubic-bezier(.2,.7,.2,1) both}
.swap>*{animation:swapIn .7s cubic-bezier(.2,.7,.2,1) both}
.swap>*:nth-child(2){animation-delay:.06s}.swap>*:nth-child(3){animation-delay:.12s}.swap>*:nth-child(4){animation-delay:.18s}.swap>*:nth-child(5){animation-delay:.24s}.swap>*:nth-child(6){animation-delay:.3s}.swap>*:nth-child(7){animation-delay:.36s}
.card img{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.045)}
.card .placard{transform:translateY(14px);opacity:0;transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .55s}
.card:hover .placard,.card:focus-within .placard{transform:none;opacity:1}
.pill{transition:background .4s,color .4s,transform .35s}
.pill:hover{transform:translateY(-1px)}
.btn{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.btn:hover{transform:translateY(-2px)}
.walk{scrollbar-width:none;scroll-behavior:smooth}.walk::-webkit-scrollbar{display:none}
@keyframes approach{from{opacity:.45;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){.room{animation:approach linear both;animation-timeline:view(inline);animation-range:entry 20% cover 48%}}
@media (max-width:720px){.card .placard{transform:none;opacity:1}.room{flex-basis:100vw!important;flex-direction:column!important;gap:16px!important;height:auto!important;padding:48px 24px 120px!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="site.css">
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #141518; background: #F3F2EE; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased">

  <header style="position: sticky; top: 0; z-index: 5; padding: 14px 24px; display: flex; justify-content: center">
    <div class="glass" style="width: 100%; max-width: 1320px; box-sizing: border-box; border-radius: 999px; padding: 8px 8px 8px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <a href="index.html" style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px"><span class="live" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #0E5A6C"></span>explore.cincinnati</a>
      <nav aria-label="Primary" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; font-weight: 500">
        <a href="collection.html" style="padding: 10px 14px; border-radius: 999px; background: rgba(20,21,24,0.06)">Collection</a>
        <a href="collection.html" style="padding: 10px 14px; border-radius: 999px">Stories</a>
        <a href="index.html" style="padding: 10px 14px; border-radius: 999px">Map</a>
        <a href="index.html" style="padding: 10px 14px; border-radius: 999px">About</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 6px">
        <a href="https://www.instagram.com/explore.cincinnati/" aria-label="Instagram" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(20,21,24,0.12)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"></circle></svg></a>
        <a href="print.html" class="btn" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; background: #141518; color: #F3F2EE; border-radius: 999px; font-size: 14px; font-weight: 600">Cart · 0</a>
      </div>
    </div>
  </header>

  <!-- HEADER + MODE SWITCH -->
  <section style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 64px 40px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 720px">
        <p class="rise" style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 21px; font-weight: 400; color: #0E5A6C">The collection</p>
        <h1 class="rise d1" style="margin: 0; font-size: 76px; font-weight: 500; line-height: 0.98; letter-spacing: -0.04em">{{heading}}</h1>
        <p class="rise d2" style="margin: 0; font-size: 16px; line-height: 1.6; color: #5E6168">{{blurb}}</p>
      </div>
      <!-- Prints / Stories switch -->
      <div role="group" aria-label="View" class="glass" style="display: inline-flex; padding: 6px; border-radius: 999px; gap: 4px">
        <button type="button" onClick="{{showPrints}}" class="pill" style="height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: {{printsBg}}; color: {{printsFg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Prints</button>
        <button type="button" onClick="{{showStories}}" class="pill" style="height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: {{storiesBg}}; color: {{storiesFg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Stories</button>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div role="group" aria-label="Gallery" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button type="button" onClick="{{f.pick}}" class="pill" style="height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(20,21,24,0.12); background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{f.label}}</button>
        </sc-for>
      </div>
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 17px; color: #5E6168">{{count}} {{noun}}</span>
    </div>
  </section>

  <!-- PRINTS VIEW: the gallery walk -->
  <sc-if value="{{isPrints}}" hint-placeholder-val="{{true}}">
  <section class="swap" style="padding: 0 0 96px; display: flex; flex-direction: column; gap: 18px">
    <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 0 40px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 16px">
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 17px; color: #5E6168">Scroll sideways to walk the gallery</span>
      <div style="display: flex; gap: 6px">
        <button type="button" onClick="{{walkBack}}" aria-label="Previous work" class="glass btn" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #141518; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
        <button type="button" onClick="{{walkNext}}" aria-label="Next work" class="glass btn" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #141518; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
    </div>
    <div ref="{{walkRef}}" class="walk" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 calc(50% - 360px); padding: 0 calc(50% - 360px); background: #ECEAE4; border-top: 1px solid rgba(20,21,24,0.06); border-bottom: 1px solid rgba(20,21,24,0.06)">
      <sc-for list="{{prints}}" as="p" hint-placeholder-count="6">
        <article class="room" style="flex: 0 0 720px; scroll-snap-align: center; position: relative; height: 640px; display: flex; align-items: center; justify-content: center; gap: 36px; padding: 0 40px; box-sizing: border-box; border-left: 1px solid rgba(20,21,24,0.06)">
          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #E2E0D9"></div>
          <span style="position: absolute; top: 22px; left: 40px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: #5E6168">{{p.num}}</span>
          <a href="print.html" class="card" style="position: relative; display: block; width: 360px; padding: 16px; background: #FFFFFF; border: 10px solid #141518; box-shadow: 0 40px 70px rgba(20,21,24,0.28); overflow: hidden">
            <span style="display: block; overflow: hidden"><img src="{{p.img}}" alt="{{p.alt}}" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block"></span>
            <sc-if value="{{p.badge}}" hint-placeholder-val="{{true}}">
              <span class="glass" style="position: absolute; top: 26px; left: 26px; padding: 5px 11px; border-radius: 999px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 14px; color: #141518">{{p.badge}}</span>
            </sc-if>
          </a>
          <div class="glass" style="position: relative; width: 200px; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; color: #141518">
            <h2 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2">{{p.title}}</h2>
            <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: #5E6168">{{p.place}}</span>
            <span style="font-size: 13px; color: #5E6168">Archival print · {{p.price}}</span>
            <a href="print.html" style="margin-top: 6px; font-size: 13px; font-weight: 600; color: #0E5A6C">View print →</a>
          </div>
        </article>
      </sc-for>
      <div aria-hidden="true" style="flex: 0 0 1px"></div>
    </div>
  </section>
  </sc-if>

  <!-- STORIES VIEW -->
  <sc-if value="{{isStories}}" hint-placeholder-val="{{false}}">
  <section style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 0 40px 96px; box-sizing: border-box">
    <div class="swap" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
      <sc-for list="{{stories}}" as="s" hint-placeholder-count="4">
        <a href="story.html" class="card" style="display: flex; gap: 20px; padding: 16px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(20,21,24,0.06); color: #141518">
          <span style="flex: 0 0 180px; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: #E6E4DE; display: block"><img src="{{s.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></span>
          <span style="display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 6px 4px">
            <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: #5E6168">{{s.place}}</span>
            <span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15">{{s.title}}</span>
            <span style="font-size: 14px; line-height: 1.55; color: #5E6168; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{s.excerpt}}</span>
            <span style="margin-top: auto; font-size: 13px; font-weight: 600; color: #0E5A6C">Read →</span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>
  </sc-if>

  <!-- HOW PRINTS ARE MADE -->
  <section style="background: #FFFFFF; border-top: 1px solid rgba(20,21,24,0.08)">
    <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 80px 40px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #0E5A6C">01</span><h3 style="margin: 0; font-size: 17px; font-weight: 600">Archival paper</h3><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5E6168">Cotton matte or baryta. Rated 100+ years.</p></div>
      <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #0E5A6C">02</span><h3 style="margin: 0; font-size: 17px; font-weight: 600">Signed &amp; numbered</h3><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5E6168">Hand-signed on the back, with the edition number.</p></div>
      <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #0E5A6C">03</span><h3 style="margin: 0; font-size: 17px; font-weight: 600">Framed locally</h3><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5E6168">Black or natural oak, built in [NEIGHBORHOOD].</p></div>
      <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #0E5A6C">04</span><h3 style="margin: 0; font-size: 17px; font-weight: 600">Easy returns</h3><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5E6168">30 days, no questions.</p></div>
    </div>
  </section>

  <footer style="margin-top: auto; border-top: 1px solid rgba(20,21,24,0.1)">
    <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 12px; color: #5E6168">
      <span>© 2026 explore.cincinnati · All photographs © [PHOTOGRAPHER NAME]</span>
      <span>Shipping · Returns · Privacy</span>
    </div>
  </footer>
</div>
</template>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'prints', col: 'All' };
    this.walkEl = null;
    this.walkRef = (el) => { this.walkEl = el; };
  }
  walk(dir) {
    if (this.walkEl) this.walkEl.scrollBy({ left: dir * 720, behavior: 'smooth' });
  }
  renderVals() {
    const works = [
      { num: 'No. 02', title: 'Roebling, in the fog', place: 'Roebling Bridge', col: 'Fog & Night', price: '$65', badge: 'New', img: 'img/roebling-fog.webp', alt: 'Roebling Suspension Bridge tower lit amber in thick fog', story: 'The night the bridge disappeared', excerpt: '[Caption excerpt — where he parked, what lens, why he waited for the fog to swallow the far tower…]', read: '5 min' },
      { num: 'No. 01', title: 'Fog over the Ohio', place: 'Smale Park', col: 'Fog & Night', price: '$65', badge: '', img: 'img/skyline-fog.webp', alt: 'Downtown skyline glowing through night fog, reflected in the river', story: 'When the city floats', excerpt: '[Caption excerpt — a river inversion, the tower lights, the quiet at Smale at midnight…]', read: '4 min' },
      { num: 'No. 03', title: 'A doorway to somewhere else', place: '[Neighborhood]', col: 'Fog & Night', price: '$55', badge: 'Limited', img: 'img/tunnel-neon.webp', alt: 'A pedestrian tunnel glowing blue under a red-haloed streetlight', story: 'A doorway to somewhere else', excerpt: '[Caption excerpt — the mural, the sodium light turning the fog red, the tunnel that lights up blue at night…]', read: '3 min' },
      { num: 'No. 04', title: 'The concrete lilypads', place: 'Bellevue Hill', col: 'Autumn', price: '$55', badge: '', img: 'img/bellevue-hill.webp', alt: 'Concrete canopy at Bellevue Hill Park framing the skyline', story: 'The concrete lilypads nobody looks up at', excerpt: '[Caption excerpt — the 1970s overlook, the architect, why the city almost tore it down…]', read: '6 min' },
      { num: 'No. 05', title: 'Upside down, Spring Grove', place: 'Spring Grove', col: 'Reflections', price: '$55', badge: '', img: 'img/spring-grove-reflect.webp', alt: 'A columned mausoleum reflected upside down in a pond', story: 'The reflection was sharper', excerpt: '[Caption excerpt — the second-largest cemetery in the country, the lake, and why he flipped the frame…]', read: '4 min' },
      { num: 'No. 06', title: 'Golden hour, flipped', place: 'Spring Grove', col: 'Reflections', price: '$55', badge: '', img: 'img/spring-grove-autumn.webp', alt: 'Autumn trees and a white temple reflected in still water', story: 'Golden hour, flipped', excerpt: '[Caption excerpt — the last light in October, the stillness of the water, the temple…]', read: '3 min' },
      { num: 'No. 07', title: 'The Sugarcreek clock', place: 'Sugarcreek, OH', col: 'Day trips', price: '$45', badge: '', img: 'img/sugarcreek-clock.webp', alt: 'The world’s largest cuckoo clock in Sugarcreek, Ohio', story: 'The world’s largest cuckoo clock', excerpt: '[Caption excerpt — two hours north, Amish country, and the band that plays every half hour…]', read: '4 min' }
    ];
    const names = ['All', 'Fog & Night', 'Autumn', 'Reflections', 'Day trips'];
    const { mode, col } = this.state;
    const isPrints = mode === 'prints';
    const shown = col === 'All' ? works : works.filter((w) => w.col === col);
    const filters = names.map((n) => ({
      label: n,
      bg: n === col ? '#141518' : 'rgba(255,255,255,0.6)',
      fg: n === col ? '#F3F2EE' : '#141518',
      pick: () => this.setState({ col: n })
    }));
    const stories = shown.map((w) => ({ num: w.num, title: w.story, place: w.place, date: '[DATE]', img: w.img, excerpt: w.excerpt, read: w.read }));
    return {
      filters,
      prints: shown,
      stories,
      isPrints,
      isStories: !isPrints,
      count: shown.length,
      noun: isPrints ? 'works' : 'stories',
      heading: isPrints ? 'Take the city home.' : 'The captions, unabridged.',
      blurb: isPrints ? 'Archival prints, signed and numbered. Each one links back to the story of how it was made.' : 'Every post becomes a story the moment it is published — the full caption, the place, the settings, the print.',
      printsBg: isPrints ? '#141518' : 'transparent',
      printsFg: isPrints ? '#F3F2EE' : '#141518',
      storiesBg: isPrints ? 'transparent' : '#141518',
      storiesFg: isPrints ? '#141518' : '#F3F2EE',
      walkRef: this.walkRef,
      walkNext: () => this.walk(1),
      walkBack: () => this.walk(-1),
      showPrints: () => this.setState({ mode: 'prints' }),
      showStories: () => this.setState({ mode: 'stories' })
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
