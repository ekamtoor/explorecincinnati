body{margin:0;background:#F3F2EE}
a{color:#141518;text-decoration:none}a:hover{color:#0E5A6C}
.glass{background:rgba(255,255,255,0.58);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 12px 40px rgba(20,21,24,0.08)}
.glass-dark{background:rgba(20,21,24,0.42);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 12px 40px rgba(20,21,24,0.18);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
@keyframes mist{0%{transform:translateX(-18%) translateY(0)}100%{transform:translateX(18%) translateY(-6%)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}
.kb{animation:kb 14s cubic-bezier(.2,.6,.2,1) both}
.mist{animation:mist 16s ease-in-out infinite alternate}
.marquee{display:flex;width:max-content;animation:marquee 46s linear infinite}
.marquee:hover{animation-play-state:paused}
.live{animation:blink 2.4s ease-in-out infinite}
.card img{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.045)}
.card .placard{transform:translateY(14px);opacity:0;transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .55s}
.card:hover .placard,.card:focus-within .placard{transform:none;opacity:1}
.lift{transition:transform .6s cubic-bezier(.2,.7,.2,1),box-shadow .6s}
.lift:hover{transform:translateY(-6px);box-shadow:0 24px 60px rgba(20,21,24,0.14)}
.btn{transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s,color .35s}
.btn:hover{transform:translateY(-2px)}
@supports (animation-timeline: view()){.reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 35%}}
@media (max-width:720px){.card .placard{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
