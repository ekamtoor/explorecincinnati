<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE">
<title>explore.cincinnati — Roebling, in the fog (print)</title>
<meta name="description" content="Photographs, fine-art prints and the stories behind them — Cincinnati, seen slowly. Test site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F2EE}
a{color:#141518;text-decoration:none}a:hover{color:#0E5A6C}
.glass{background:rgba(255,255,255,0.58);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 12px 40px rgba(20,21,24,0.08)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.12s}
.live{animation:blink 2.4s ease-in-out infinite}
.frame{transition:max-width .8s cubic-bezier(.2,.7,.2,1),padding .6s,border .6s,background .6s,box-shadow .8s}
.wall{transition:background .6s}
.opt{transition:background .35s,border-color .35s,transform .35s}
.opt:hover{transform:translateY(-2px)}
.cta{transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s}
.cta:hover{transform:translateY(-2px)}
.cta:active{animation:pop .4s}
.card img{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.045)}
@supports (animation-timeline: view()){.reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 35%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="site.css">
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

  <header style="position: sticky; top: 0; z-index: 5; padding: 14px 24px; display: flex; justify-content: center">

      <div style="display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 21px; color: #0E5A6C">No. 02 · Fog &amp; Night · Limited edition</p>

      </div>

      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top: 1px solid rgba(20,21,24,0.1); padding-top: 16px">
        <span style="font-size: 34px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">{{price}}</span>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px; display: flex; justify-content: space-between; width: 100%"><span>Size</span><span style="font-weight: 400; color: #5E6168">inches, image area</span></legend>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
            <button type="button" onClick="{{s.pick}}" class="opt" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; padding: 0 8px; border-radius: 14px; border: 1px solid {{s.borderColor}}; background: {{s.bg}}; color: #141518; font-family: inherit; cursor: pointer"><span style="font-size: 15px; font-weight: 600">{{s.label}}</span><span style="font-size: 12px; color: #5E6168">{{s.price}}</span></button>
          </sc-for>
        </div>
      </fieldset>

      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px; flex: 1 1 180px">
          <legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px">Paper</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{papers}}" as="p" hint-placeholder-count="2">
              <button type="button" onClick="{{p.pick}}" class="opt" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{p.borderColor}}; background: {{p.bg}}; color: #141518; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{p.swatch}}; border: 1px solid rgba(20,21,24,0.25)"></span>{{p.label}}</button>
            </sc-for>
          </div>
        </fieldset>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px; flex: 1 1 220px">
          <legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px">Frame</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
              <button type="button" onClick="{{f.pick}}" class="opt" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.borderColor}}; background: {{f.bg}}; color: #141518; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{f.swatch}}; border: 1px solid rgba(20,21,24,0.25)"></span>{{f.label}}<span style="color: #5E6168">{{f.price}}</span></button>

          </div>
        </fieldset>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <button type="button" onClick="{{addToCart}}" class="cta" style="height: 54px; border-radius: 999px; border: 0; background: {{ctaBg}}; color: #F3F2EE; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{cta}}</button>
        <button type="button" class="cta" style="height: 48px; border-radius: 999px; border: 1px solid rgba(20,21,24,0.18); background: rgba(255,255,255,0.6); color: #141518; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Buy now · Apple Pay / Shop Pay</button>
        <p style="margin: 4px 0 0; font-size: 13px; line-height: 1.5; color: #5E6168">Ships in 3–5 business days from Cincinnati; framed in 7–10. 30-day returns. Free shipping over [AMOUNT].</p>
      </div>

      <details style="border-top: 1px solid rgba(20,21,24,0.12); padding: 12px 0 0">
        <summary style="cursor: pointer; font-size: 14px; font-weight: 500; list-style: none; display: flex; justify-content: space-between">Paper, printing &amp; the signed back<span aria-hidden="true">+</span></summary>
        <p style="margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #5E6168">Printed on [PAPER NAME], a 100% cotton archival paper, with pigment inks rated 100+ years. A 0.5″ white border for matting; signed and numbered on the back with the edition stamp.</p>
      </details>
    </div>
  </section>

  <!-- WALL LABEL / STORY -->
  <section class="reveal" style="background: #FFFFFF">
    <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 88px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 64px">
      <div style="flex: 0 1 320px; display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 21px; color: #0E5A6C">Wall label</p>
        <h2 style="margin: 0; font-size: 40px; font-weight: 500; line-height: 1.02; letter-spacing: -0.035em">The night the bridge disappeared</h2>
        <dl style="margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px">
          <dt style="color: #5E6168">Shot</dt><dd style="margin: 0">[DATE], 11:40 pm</dd>
          <dt style="color: #5E6168">Where</dt><dd style="margin: 0">Covington landing, KY</dd>
          <dt style="color: #5E6168">Camera</dt><dd style="margin: 0">[CAMERA] · [LENS]</dd>
          <dt style="color: #5E6168">Settings</dt><dd style="margin: 0">[f-stop] · [shutter] · ISO [N]</dd>
        </dl>
        <a href="story.html" style="margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; color: #0E5A6C; font-size: 14px; font-weight: 600">Read the full story
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
      <div style="flex: 1 1 480px; min-width: 0; font-size: 20px; line-height: 1.6; display: flex; flex-direction: column; gap: 20px; color: #2A2C31">
        <p style="margin: 0">[The Instagram caption, synced automatically. The first two paragraphs show here; the full text lives on the story page.]</p>
        <p style="margin: 0">[Second paragraph — the history of the Roebling, the 1866 opening, why the fog sits on the river on nights like this one…]</p>
      </div>
    </div>
  </section>

  <!-- RELATED -->
  <section class="reveal" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 72px 40px 88px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <h2 style="margin: 0; font-size: 34px; font-weight: 500; letter-spacing: -0.03em">Also in Fog &amp; Night</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
      <a href="collection.html" class="card" style="display: flex; flex-direction: column; gap: 10px"><span style="display: block; border-radius: 20px; overflow: hidden; background: #E6E4DE"><img loading="lazy" decoding="async" src="img/skyline-fog.webp" alt="Fog over the Ohio" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block"></span><span style="font-size: 18px; font-weight: 600; letter-spacing: -0.015em; padding: 0 4px">Fog over the Ohio</span><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: #5E6168; padding: 0 4px">No. 01 · from $65</span></a>
      <a href="collection.html" class="card" style="display: flex; flex-direction: column; gap: 10px"><span style="display: block; border-radius: 20px; overflow: hidden; background: #E6E4DE"><img loading="lazy" decoding="async" src="img/tunnel-neon.webp" alt="A doorway to somewhere else" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block"></span><span style="font-size: 18px; font-weight: 600; letter-spacing: -0.015em; padding: 0 4px">A doorway to somewhere else</span><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: #5E6168; padding: 0 4px">No. 03 · from $55</span></a>
      <a href="collection.html" class="card" style="display: flex; flex-direction: column; gap: 10px"><span style="display: block; border-radius: 20px; overflow: hidden; background: #E6E4DE"><img loading="lazy" decoding="async" src="img/bellevue-hill.webp" alt="The concrete lilypads" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block"></span><span style="font-size: 18px; font-weight: 600; letter-spacing: -0.015em; padding: 0 4px">The concrete lilypads</span><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: #5E6168; padding: 0 4px">No. 04 · from $55</span></a>
    </div>
  </section>

  <footer style="margin-top: auto; border-top: 1px solid rgba(20,21,24,0.1)">
    <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 12px; color: #5E6168">
      <span>© 2026 explore.cincinnati · All photographs © [PHOTOGRAPHER NAME]</span>
      <span>Shipping · Returns · Privacy</span>
    </div>
  </footer>
</div>
</template>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: 1, paper: 0, frame: 0, cart: 0, added: false, view: 'wall' };
  }
  renderVals() {
    const sizeList = [
      { label: '8 × 10', price: 65, max: '270px' },
      { label: '12 × 16', price: 95, max: '350px' },
      { label: '16 × 20', price: 140, max: '420px' },
      { label: '24 × 30', price: 240, max: '520px' }
    ];
    const paperList = [
      { label: 'Matte cotton', swatch: '#F3F2EE', mat: '#F7F6F2' },
      { label: 'Baryta gloss', swatch: '#FFFFFF', mat: '#FFFFFF' }
    ];
    const frameList = [
      { label: 'Unframed', price: '$0', add: 0, border: '0 solid transparent', pad: '0px', swatch: '#F3F2EE' },
      { label: 'Black oak', price: '+$85', add: 85, border: '12px solid #141518', pad: '26px', swatch: '#141518' },
      { label: 'Natural oak', price: '+$85', add: 85, border: '12px solid #C9A77A', pad: '26px', swatch: '#C9A77A' }
    ];
    const onB = '#141518', offB = 'rgba(20,21,24,0.14)';
    const onBg = 'rgba(14,90,108,0.1)', offBg = 'rgba(255,255,255,0.65)';
    const s = this.state;
    const onWall = s.view === 'wall';
    const sizes = sizeList.map((x, i) => ({
      label: x.label, price: '$' + x.price,
      borderColor: i === s.size ? onB : offB, bg: i === s.size ? onBg : offBg,
      pick: () => this.setState({ size: i, added: false })
    }));
    const papers = paperList.map((x, i) => ({
      label: x.label, swatch: x.swatch,
      borderColor: i === s.paper ? onB : offB, bg: i === s.paper ? onBg : offBg,
      pick: () => this.setState({ paper: i, added: false })
    }));
    const frames = frameList.map((x, i) => ({
      label: x.label, price: x.price, swatch: x.swatch,
      borderColor: i === s.frame ? onB : offB, bg: i === s.frame ? onBg : offBg,
      pick: () => this.setState({ frame: i, added: false })
    }));
    const total = sizeList[s.size].price + frameList[s.frame].add;
    return {
      sizes, papers, frames,
      price: '$' + total,
      sizeLabel: sizeList[s.size].label,
      paperLabel: paperList[s.paper].label,
      frameLabel: frameList[s.frame].label,
      frameMax: sizeList[s.size].max,
      matColor: paperList[s.paper].mat,
      matPad: frameList[s.frame].pad,
      frameBorder: frameList[s.frame].border,
      onWall,
      wallBg: onWall ? '#ECEAE4' : '#FFFFFF',
      scaleNote: onWall ? 'to scale on a 9 ft wall' : 'print only',
      wallBtnBg: onWall ? '#141518' : 'transparent', wallBtnFg: onWall ? '#F3F2EE' : '#141518',
      printBtnBg: onWall ? 'transparent' : '#141518', printBtnFg: onWall ? '#141518' : '#F3F2EE',
      showWall: () => this.setState({ view: 'wall' }),
      showPrint: () => this.setState({ view: 'print' }),
      cartCount: s.cart,
      cta: s.added ? 'Added to cart ✓' : 'Add to cart · $' + total,
      ctaBg: s.added ? '#0E5A6C' : '#141518',
      addToCart: () => this.setState({ cart: s.cart + 1, added: true })
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
